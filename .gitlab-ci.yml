stages:
  - lint

lint-job:
  stage: lint
  script:
    - cp ./materials/linters/.clang-format ./src/.clang-format
    - cd ./src/
    - rm -rf gcovr_env/
    - find . -name "*.cpp" -exec clang-format -n {} \;
    - find . -name "*.hpp" -exec clang-format -n {} \;
    - find . -name "*.tpp" -exec clang-format -n {} \;
    - find . -name "*.cc" -exec clang-format -n {} \;
    - find . -name "*.c" -exec clang-format -n {} \;
    - find . -name "*.h" -exec clang-format -n {} \;
